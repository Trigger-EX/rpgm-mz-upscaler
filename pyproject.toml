[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpgm-upscaler"
version = "0.1.0"
description = "Upscale an RPG Maker MV/MZ game to 1920x1080 (GUI + CLI)"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["Pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
translate = ["ctranslate2>=4,<5", "sentencepiece>=0.2,<0.3"]
ocr = ["opencv-python-headless>=4.8"]

[project.scripts]
rpgm-upscaler = "rpgm_upscaler.__main__:main"
rpgm-upscaler-cli = "rpgm_upscaler.cli:main"
rpgm-hub = "rpgm_upscaler.__main__:main"
rpgm-hub-cli = "rpgm_upscaler.cli:main"

[tool.setuptools.packages.find]
include = ["rpgm_upscaler*"]

[tool.setuptools.package-data]
rpgm_upscaler = ["core/templates/*", "translate/data/*", "rgss/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
